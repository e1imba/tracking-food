name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate required documentation
        run: |
          test -s AGENTS.md
          test -s docs/functional-spec.md
          test -s docs/technical-spec.md
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and validate application
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile smoke tests
        run: npm run test:e2e
