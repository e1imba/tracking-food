name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tracking_food
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: tracking_food_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tracking_food -d tracking_food_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tracking_food:synthetic-ci-only@localhost:5432/tracking_food_test
      TEST_DATABASE_URL: postgresql://tracking_food:synthetic-ci-only@localhost:5432/tracking_food_test
    steps:
      - uses: actions/checkout@v4
      - name: Validate required documentation
        run: |
          test -s AGENTS.md
          test -s docs/functional-spec.md
          test -s docs/technical-spec.md
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and validate application
        run: |
          npm ci
          npm run db:migrate
          npm run lint
          npm run typecheck
          npm run test
          npm run test:integration
          npm run build
      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile auth and smoke tests (synthetic credentials)
        run: npm run test:e2e
